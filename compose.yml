services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
    command: >
      -m /models/${MODEL_FILENAME}
      --host 0.0.0.0
      --port 1234
      -c 4096
      -ngl 999
      --cache-type-k q8_0
      --cache-type-v q8_0
      --reasoning-budget 0
    ports:
      - "1234:1234"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1234/v1/models"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 90s

  app:
    build: .
    container_name: email-classifier
    depends_on:
      llama-server:
        condition: service_healthy
    environment:
      - LM_STUDIO_URL=http://llama-server:1234
    env_file:
      - .env
    volumes:
      - ./service_account.json:/app/service_account.json:ro
    restart: "no"